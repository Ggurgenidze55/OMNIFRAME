<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="modernGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e3ff00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0ff40;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d6e600;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main logo container -->
  <g filter="url(#shadow)">
    <!-- OMNIframe text -->
    <text x="100" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="url(#modernGradient)" letter-spacing="1">
      OMNIframe
    </text>
    
    <!-- Subtitle -->
    <text x="100" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="middle" fill="#e3ff00" opacity="0.7" letter-spacing="0.5">
      WEB DEVELOPMENT
    </text>
  </g>
  
  <!-- Decorative accent lines -->
  <line x1="20" y1="15" x2="35" y2="15" stroke="#e3ff00" stroke-width="2" opacity="0.8"/>
  <line x1="165" y1="15" x2="180" y2="15" stroke="#e3ff00" stroke-width="2" opacity="0.8"/>
  
  <!-- Corner accents -->
  <circle cx="15" cy="15" r="2" fill="#e3ff00" opacity="0.6"/>
  <circle cx="185" cy="15" r="2" fill="#e3ff00" opacity="0.6"/>
  <circle cx="15" cy="45" r="2" fill="#e3ff00" opacity="0.6"/>
  <circle cx="24" cy="45" r="2" fill="#e3ff00" opacity="0.6"/>
</svg>
