<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8cc00;stop-opacity:1" />
    </linearGradient>
    
    <filter id="faviconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#1a1a1a" stroke="#e3ff00" stroke-width="1"/>
  
  <!-- O letter -->
  <text x="16" y="22" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="url(#faviconGradient)" filter="url(#faviconGlow)">
    O
  </text>
  
  <!-- Decorative dots -->
  <circle cx="8" cy="8" r="1" fill="#e3ff00" opacity="0.8"/>
  <circle cx="24" cy="8" r="1" fill="#e3ff00" opacity="0.8"/>
  <circle cx="8" cy="24" r="1" fill="#e3ff00" opacity="0.8"/>
  <circle cx="24" cy="24" r="1" fill="#e3ff00" opacity="0.8"/>
</svg>
